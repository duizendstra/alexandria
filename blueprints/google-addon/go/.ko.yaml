# ko build configuration for Google Calendar Add-on Go Service
# Builds Go source directly into minimal Chainguard static container images.
#
# Usage:
#   ko build .                     — build + push to KO_DOCKER_REPO
#   ko build . --local             — build to local Docker daemon
#   ko build . --tarball=<name>    — build to OCI tarball
#
# Pinned digest ensures reproducible builds.
defaultBaseImage: cgr.dev/chainguard/static:latest@sha256:77d8b8925dc27970ec2f48243f44c7a260d52c49cd778288e4ee97566e0cb75b

defaultPlatforms:
  - linux/amd64

sbom: spdx

builds:
  - dir: .
    main: .
    flags:
      - -trimpath
    ldflags:
      - -w
    env:
      - CGO_ENABLED=0
